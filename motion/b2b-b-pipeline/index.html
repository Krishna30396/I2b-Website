        position: relative; width: 100%; height: 100%; overflow: hidden;

      }
      #scene { position: absolute; inset: 0; }

      .hub { position: absolute; left: 462px; top: 438px; width: 184px; height: 184px; z-index: 5; }
      .hub-core {
        width: 100%; height: 100%; border-radius: 28px;
        background: var(--live); border: var(--line) solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        font: 500 18px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); text-align: center;
      }
      .hub-core svg { width: 60px; height: 60px; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .block { position: absolute; left: 708px; width: 312px; z-index: 3; }
      .count { position: absolute; left: 708px; top: 262px; display: flex; flex-direction: column; gap: 4px; }
      .count b { font: 500 44px var(--f-mono); color: var(--ink); }
      .count span { font: 500 18px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: #0f0f0fa6; }
      .headline { position: absolute; left: 80px; top: 902px; }
    </style>
  </head>

        <div data-hf-id="hf-8eqf" class="art sheet" id="a1" data-layout-allow-overflow="true" data-layout-allow-overlap="true" data-layout-allow-occlusion="true"><span data-hf-id="hf-gm9w" class="ico"><svg data-hf-id="hf-b65t" viewBox="0 0 44 44"><rect data-hf-id="hf-wlha" x="5" y="5" width="34" height="34" rx="4" class="fillc"/><path data-hf-id="hf-qq0h" d="M5 16h34M5 27h34M17 5v34"/></svg></span><span data-hf-id="hf-41eq">Shipments_v7_FINAL.xlsx<small data-hf-id="hf-fmc0">edited 14 times</small></span></div>
        <div data-hf-id="hf-mn66" class="art mail" id="a2" data-layout-allow-overflow="true" data-layout-allow-overlap="true" data-layout-allow-occlusion="true"><span data-hf-id="hf-qj98" class="ico"><svg data-hf-id="hf-57mt" viewBox="0 0 44 44"><rect data-hf-id="hf-1tz0" x="4" y="9" width="36" height="26" rx="4" class="fillc"/><path data-hf-id="hf-m5xv" d="M5 11l17 13 17-13"/></svg></span><span data-hf-id="hf-jj84">Re: Re: delay at port<small data-hf-id="hf-3hmn">12 replies</small></span></div>
        <div data-hf-id="hf-g3po" class="art chat" id="a3" data-layout-allow-overflow="true" data-layout-allow-overlap="true" data-layout-allow-occlusion="true"><span data-hf-id="hf-pcc5" class="ico"><svg data-hf-id="hf-6ejw" viewBox="0 0 44 44"><path data-hf-id="hf-p0qk" d="M6 8h32v22H18l-8 7v-7H6z" class="fillc"/></svg></span><span data-hf-id="hf-8e5e">Driver: stuck at gate 3<small data-hf-id="hf-417f">WhatsApp · 6:42</small></span></div>

          <svg data-hf-id="hf-piht" viewBox="0 0 60 60"><rect data-hf-id="hf-tafa" x="8" y="8" width="18" height="18" rx="3"/><rect data-hf-id="hf-5ovr" x="34" y="8" width="18" height="18" rx="3"/><rect data-hf-id="hf-8hdn" x="8" y="34" width="18" height="18" rx="3"/><rect data-hf-id="hf-xg5r" x="34" y="34" width="18" height="18" rx="3" fill="#0f0f0f"/></svg>

        <div data-hf-id="hf-qrfu" class="block" id="b6"><span data-hf-id="hf-x5jr" class="chip mail">MAIL</span>SH-2058<span data-hf-id="hf-0xk6" class="dot"></span></div>
        <div data-hf-id="hf-jf2z" class="block" id="b7"><span data-hf-id="hf-j43l" class="chip chat">CHAT</span>SH-2063<span data-hf-id="hf-1bv7" class="dot"></span></div>
        <div data-hf-id="hf-chu9" class="block" id="b8"><span data-hf-id="hf-wilk" class="chip invoice">PDF</span>INV-0431<span data-hf-id="hf-1q68" class="dot"></span></div>

        <div data-hf-id="hf-y8b9" class="headline" id="headline">Many inputs. One system.</div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const S = document.getElementById("root");
      const box = el => { const r = el.getBoundingClientRect(), s = S.getBoundingClientRect(); return { l: r.left - s.left, t: r.top - s.top, w: r.width, h: r.height, cx: r.left - s.left + r.width / 2, cy: r.top - s.top + r.height / 2 }; };
      const ART_SCALE = 0.78;

      // ---- static layout, measured before any tween (deterministic) ----
      const blocks = [1, 2, 3, 4, 5, 6, 7, 8].map(i => document.getElementById("b" + i));
      blocks.forEach((b, k) => { b.style.top = (800 - k * 64) + "px"; });
      const H = box(document.getElementById("hub"));
      const arts = ["#a1", "#a2", "#a3", "#a4"].map(q => document.querySelector(q));
      const AR = arts.map(box);
      AR.forEach((a, i) => {
        const x1 = a.cx + (a.w * ART_SCALE) / 2 + 10, y1 = a.cy, x2 = H.l - 6, y2 = H.cy + (i - 1.5) * 34;
        const mx = (x1 + x2) / 2;
        document.getElementById("p" + (i + 1)).setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      });
      const paths = [1, 2, 3, 4].map(i => document.getElementById("p" + i));
      const lens = paths.map(p => p.getTotalLength());
      const BB = blocks.map(box);

      tl.set(paths, { strokeDasharray: (i) => lens[i], strokeDashoffset: (i) => lens[i], immediateRender: true }, 0);
      tl.set(blocks, { autoAlpha: 0, immediateRender: true }, 0);

      // ---- MESS: inputs pile up on the left ----
      tl.fromTo("#topbar", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "sine.out" }, 0.1);
      [[-6, "expo.out", 0.7], [4, "back.out(1.3)", 0.8], [-3, "expo.out", 0.65], [6, "back.out(1.1)", 0.85]].forEach(([r, e, d], i) => {
        tl.fromTo(arts[i], { x: -480, rotation: r * 3, scale: ART_SCALE, autoAlpha: 0 }, { x: 0, rotation: r, scale: ART_SCALE, autoAlpha: 1, duration: d, ease: e }, 0.2 + i * 0.12);
      });
      tl.fromTo("#hub", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, 1.0);

      // ---- SNAP: rails draw, inputs ride them into the hub ----
      paths.forEach((p, i) => tl.to(p, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 1.3 + i * 0.08));
      arts.forEach((a, i) => {
        const t = 1.95 + i * 0.16;
        tl.to(a, { x: H.cx - AR[i].cx, y: H.cy - AR[i].cy, rotation: 0, scale: 0.18, duration: 0.5, ease: "power3.in" }, t);
        tl.to(a, { autoAlpha: 0, duration: 0.1, ease: "none" }, t + 0.42);
        tl.fromTo("#hubCore", { scale: 1 }, { scale: 1.07, duration: 0.07, ease: "power1.out", yoyo: true, repeat: 1 }, t + 0.48);
      });
      tl.to(paths, { opacity: 0.28, duration: 0.4, ease: "sine.inOut" }, 2.75);

      // ---- SCALE: the hub stamps uniform blocks into a growing stack ----
      blocks.forEach((b, k) => {
        const t = 2.95 + k * 0.2;
        tl.fromTo(b, { autoAlpha: 0, x: H.cx - BB[k].cx, y: H.cy - BB[k].cy, scale: 0.3 },
          { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: 0.42, ease: k % 2 ? "back.out(1.5)" : "power3.out" }, t);
        tl.to(b.querySelector(".dot"), { backgroundColor: "#6ae3ff", duration: 0.12, ease: "none" }, t + 0.42);
      });
      tl.fromTo("#count", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "sine.out" }, 2.95);
      const n = { v: 0 };
      tl.to(n, { v: 2400, duration: 1.8, ease: "power1.inOut", onUpdate: () => { document.getElementById("countNum").textContent = Math.round(n.v).toLocaleString("en-US") + " / day"; } }, 3.0);

      // ---- HOLD ----
      tl.fromTo("#headline", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "expo.out" }, 5.0);

      window.__timelines["b2b-b"] = tl;
      tl.seek(0);
    </script>
  </body>
